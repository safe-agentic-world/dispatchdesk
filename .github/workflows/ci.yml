name: Customer compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  standalone:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - run: python -m pip install . build
      - run: python -m unittest discover -s tests -p test_core.py -v
      - run: python -m build
  nomos:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install '.[nomos]'
      - name: Download verified Nomos v0.13.3
        shell: python
        run: |
          import hashlib, io, os, pathlib, tarfile, urllib.request, zipfile
          windows = os.name == 'nt'
          asset = 'nomos-windows-amd64.zip' if windows else 'nomos-linux-amd64.tar.gz'
          expected = ('cbcf301b23c6642ec413c6989e19a75a30d11681026d2dd6c247668a304dce91' if windows
                      else 'd0de367cfc407595530cf7bb8862b4b6bf52698a929ff7ec79ed2ac2d26596f2')
          url = 'https://github.com/safe-agentic-world/nomos/releases/download/v0.13.3/' + asset
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read()
          if hashlib.sha256(data).hexdigest() != expected:
              raise RuntimeError('Nomos archive checksum mismatch')
          name = 'nomos.exe' if windows else 'nomos'
          if windows:
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  binary = archive.read(name)
          else:
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
                  binary = archive.extractfile(name).read()
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / name
          target.write_bytes(binary)
          target.chmod(0o755)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'NOMOS_BINARY={target}\n')
      - run: python -m unittest discover -s tests -v
